name: Release

# Build the APK with the release key and attach it to a draft GitHub Release, which the
# owner reviews and publishes. Start it by pushing a tag v<versionName> (for example v0.0.1),
# or with "Run workflow" on main, which tags the commit it built. A manual run with
# "publish" set publishes the release at once instead of leaving a draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release instead of leaving a draft"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
    env:
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the version in both build files
        run: |
          gradle_name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' build.gradle.kts)
          gradle_code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' build.gradle.kts)
          sh_name=$(sed -nE 's/^VERSION_NAME=(.+)$/\1/p' build.sh)
          sh_code=$(sed -nE 's/^VERSION_CODE=([0-9]+)$/\1/p' build.sh)
          echo "Gradle: $gradle_name ($gradle_code), build.sh: $sh_name ($sh_code), ref: $REF_NAME ($EVENT)"
          if [ "$gradle_name" != "$sh_name" ] || [ "$gradle_code" != "$sh_code" ]; then
            echo "::error::build.gradle.kts and build.sh have different versions."; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "main" ]; then
              echo "::error::Run the release workflow on main, not $REF_NAME."; exit 1
            fi
          elif [ "$REF_NAME" != "v$gradle_name" ]; then
            echo "::error::Tag $REF_NAME does not match versionName $gradle_name. Tag the release v$gradle_name."; exit 1
          fi
          echo "VERSION=$gradle_name" >> "$GITHUB_ENV"
          echo "TAG=v$gradle_name" >> "$GITHUB_ENV"

      # A release is never signed with a debug key: stop if a secret is missing.
      - name: Release key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See AGENTS.md, Releases."; exit 1
          fi
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          echo "SIGNING_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # No cache in the release job: a release build starts from a clean state.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: SDK packages for build.sh
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Gradle release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: build.sh
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" ./build.sh

      - name: Both build paths make the same app, signed with the release key
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          GRADLE_APK=build/outputs/apk/release/wow-addons.apk
          scripts/apk-summary.sh "$BT/aapt2" "$GRADLE_APK" > gradle.txt
          scripts/apk-summary.sh "$BT/aapt2" wow-addons.apk > buildsh.txt
          diff -u gradle.txt buildsh.txt
          "$BT/apksigner" verify --print-certs "$GRADLE_APK" > certs.txt
          cat certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with a debug key."; exit 1
          fi

      - name: Release files
        run: |
          mkdir -p dist
          cp build/outputs/apk/release/wow-addons.apk "dist/runeloader-$VERSION.apk"
          (cd dist && sha256sum "runeloader-$VERSION.apk" > "runeloader-$VERSION.apk.sha256")
          cat dist/*.sha256

      # A manual run tags the built commit. A tag made with the workflow token starts no
      # new workflow run, so the release is not built twice.
      - name: Tag the commit (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points at $existing. Bump the version for a new release."; exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run may refresh the files of a draft, never of a published release.
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version for a new release."; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes \
              --title "Runeloader $VERSION" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish the release (manual run with publish)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
